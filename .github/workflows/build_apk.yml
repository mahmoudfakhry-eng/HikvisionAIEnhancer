name: Auto-Generate Project & Build S23 Ultra APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate All Android Project Files & AI Models
        run: |
          mkdir -p app/src/main/java/com/hikvision/aienhancer/domain
          mkdir -p app/src/main/java/com/hikvision/aienhancer/util
          mkdir -p app/src/main/java/com/hikvision/aienhancer/ai
          mkdir -p app/src/main/java/com/hikvision/aienhancer/pipeline
          mkdir -p app/src/main/java/com/hikvision/aienhancer/ui
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-ar
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HikvisionAIEnhancer"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hikvision.aienhancer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.hikvision.aienhancer"
                  minSdk = 34
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0-S23U"
                  ndk {
                      abiFilters.add("arm64-v8a")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              androidResources {
                  noCompress += listOf("tflite")
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("com.google.ai.edge.litert:litert:1.0.1")
              implementation("com.google.ai.edge.litert:litert-gpu:1.0.1")
              implementation("com.google.ai.edge.litert:litert-support:1.0.1")
              implementation("org.opencv:opencv:4.9.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
