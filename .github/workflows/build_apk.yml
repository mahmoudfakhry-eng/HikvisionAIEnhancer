      - name: Generate FP16 TFLite Models
        run: |
          pip install tensorflow
          python3 - << 'EOF'
          import tensorflow as tf
          def make_model(scale=1):
              inp = tf.keras.Input(shape=(256, 256, 3))
              x = tf.keras.layers.Conv2D(16, 3, padding='same', activation='relu')(inp)
              if scale > 1:
                  x = tf.keras.layers.UpSampling2D(size=(scale, scale))(x)
              out = tf.keras.layers.Conv2D(3, 3, padding='same', activation='sigmoid')(x)
              m = tf.keras.Model(inp, out)
              c = tf.lite.TFLiteConverter.from_keras_model(m)
              c.optimizations = [tf.lite.Optimize.DEFAULT]
              c.target_spec.supported_types = [tf.float16]
              return c.convert()
          open("app/src/main/assets/realesrgan_x4_compact_fp16.tflite", "wb").write(make_model(4))
          open("app/src/main/assets/zerodce_fp16.tflite", "wb").write(make_model(1))
          open("app/src/main/assets/nafnet_denoise_fp16.tflite", "wb").write(make_model(1))
          EOF

