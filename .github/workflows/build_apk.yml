          EOF

          cat << 'EOF' > app/src/main/java/com/hikvision/aienhancer/util/ThermalAndMemoryMonitor.kt
          package com.hikvision.aienhancer.util

          import android.app.ActivityManager
          import android.content.Context
          import android.os.PowerManager
          import kotlinx.coroutines.delay

          class ThermalAndMemoryMonitor(context: Context) {
              private val powerManager = context.getSystemService(Context.POWER_SERVICE) as PowerManager
              private val activityManager = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager

              fun getThermalStatusLabel(): String = when (powerManager.currentThermalStatus) {
                  PowerManager.THERMAL_STATUS_NONE -> "Nominal (Cool)"
                  PowerManager.THERMAL_STATUS_LIGHT -> "Light Warmth"
                  PowerManager.THERMAL_STATUS_MODERATE -> "Moderate (Sustained)"
                  PowerManager.THERMAL_STATUS_SEVERE -> "Severe (Tile Reduced)"
                  else -> "Critical (Cooling Pause)"
              }

              suspend fun enforceThermalSafetyGuard() {
                  while (powerManager.currentThermalStatus >= PowerManager.THERMAL_STATUS_CRITICAL) {
                      delay(3000L)
                  }
                  if (powerManager.currentThermalStatus == PowerManager.THERMAL_STATUS_SEVERE) {
                      delay(150L)
                  }
              }

              fun getUsedMemoryMb(): Long {
                  val runtime = Runtime.getRuntime()
                  val jvmUsed = (runtime.totalMemory() - runtime.freeMemory()) / (1024 * 1024)
                  val nativeAllocated = android.os.Debug.getNativeHeapAllocatedSize() / (1024 * 1024)
                  return jvmUsed + nativeAllocated
              }

              fun computeSafeTileSize(requestedTileSize: Int): Int {
                  val memInfo = ActivityManager.MemoryInfo()
                  activityManager.getMemoryInfo(memInfo)
                  return if (memInfo.lowMemory || powerManager.currentThermalStatus >= PowerManager.THERMAL_STATUS_SEVERE) 128 else requestedTileSize
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hikvision/aienhancer/ai/TiledInferenceEngine.kt
          package com.hikvision.aienhancer.ai

          import android.content.Context
          import android.graphics.*
          import com.hikvision.aienhancer.domain.EnhancementConfig
          import com.hikvision.aienhancer.domain.HardwareBackend
          import org.opencv.android.Utils
          import org.opencv.core.Core
          import org.opencv.core.CvType
          import org.opencv.core.Mat
          import org.opencv.core.Rect
          import org.opencv.core.Size
          import org.opencv.imgproc.Imgproc
          import org.tensorflow.lite.Interpreter
          import org.tensorflow.lite.gpu.CompatibilityList
          import org.tensorflow.lite.gpu.GpuDelegate
          import org.tensorflow.lite.nnapi.NnApiDelegate
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.channels.FileChannel
          import kotlin.math.ceil
          import kotlin.math.max
          import kotlin.math.min

          class TiledInferenceEngine(private val context: Context, private val config: EnhancementConfig) : AutoCloseable {
              private var srInterpreter: Interpreter? = null
              private var lowLightInterpreter: Interpreter? = null
              private var denoiseInterpreter: Interpreter? = null
              private var gpuDelegate: GpuDelegate? = null
              private var nnApiDelegate: NnApiDelegate? = null
              var activeBackendSummary: String = "Adreno 740 GPU (FP16)"
                  private set
              var isUsingFallbackCpu: Boolean = false
                  private set
              private var previousEnhancedLuma: Mat? = null

              init {
                  val options = Interpreter.Options()
                  try {
                      when (config.preferredBackend) {
                          HardwareBackend.ADRENO_GPU_FP16 -> {
                              val compat = CompatibilityList()
                              if (compat.isDelegateSupportedOnThisDevice) {
                                  gpuDelegate = GpuDelegate(compat.bestOptionsForThisDevice.apply { setPrecisionLossAllowed(true) })
                                  options.addDelegate(gpuDelegate)
                                  activeBackendSummary = "Adreno 740 GPU (OpenCL FP16)"
                              } else {
                                  options.setNumThreads(8); options.setUseXNNPACK(true)
                                  isUsingFallbackCpu = true; activeBackendSummary = "CPU 8-Thread XNNPACK"
                              }
                          }
                          HardwareBackend.NNAPI_NPU -> {
                              nnApiDelegate = NnApiDelegate(NnApiDelegate.Options().setAllowFp16(true))
                              options.addDelegate(nnApiDelegate)
                              activeBackendSummary = "Hexagon NPU (NNAPI FP16)"
                          }
                          HardwareBackend.CPU_XNNPACK_8_THREADS -> {
                              options.setNumThreads(8); options.setUseXNNPACK(true)
                              isUsingFallbackCpu = true; activeBackendSummary = "CPU 8-Thread XNNPACK"
                          }
                      }
                  } catch (e: Exception) {
                      options.setNumThreads(8); options.setUseXNNPACK(true)
                      isUsingFallbackCpu = true; activeBackendSummary = "CPU 8-Thread XNNPACK"
                  }
                  srInterpreter = loadModel("realesrgan_x4_compact_fp16.tflite", options)
                  lowLightInterpreter = loadModel("zerodce_fp16.tflite", options)
                  denoiseInterpreter = loadModel("nafnet_denoise_fp16.tflite", options)
              }

              private fun loadModel(name: String, opts: Interpreter.Options): Interpreter? = try {
                  val afd = context.assets.openFd(name)
                  val buf = FileInputStream(afd.fileDescriptor).channel.map(FileChannel.MapMode.READ_ONLY, afd.startOffset, afd.declaredLength)
                  Interpreter(buf, opts)
              } catch (e: Exception) { null }

              fun processFrame(inputBitmap: Bitmap, effectiveTileSize: Int): Bitmap {
                  val srcMat = Mat()
                  Utils.bitmapToMat(inputBitmap, srcMat)
                  Imgproc.cvtColor(srcMat, srcMat, Imgproc.COLOR_RGBA2RGB)

                  var workingMat = if (config.enableLowLight) applyLowLight(srcMat) else srcMat.clone()
                  srcMat.release()

                  if (config.enableDenoise) {
                      val d = Mat()
                      Imgproc.bilateralFilter(workingMat, d, 5, 35.0, 35.0)
                      workingMat.release()
                      workingMat = d
                  }

                  if (config.enableTemporal) {
                      val t = applyTemporal(workingMat, config.temporalAlpha)
                      workingMat.release()
                      workingMat = t
                  }

                  if (config.scaleFactor > 1) {
                      val u = applySuperRes(workingMat, config.scaleFactor)
                      workingMat.release()
                      workingMat = u
                  }

                  val outBitmap = Bitmap.createBitmap(workingMat.cols(), workingMat.rows(), Bitmap.Config.ARGB_8888)
                  Imgproc.cvtColor(workingMat, workingMat, Imgproc.COLOR_RGB2RGBA)
                  Utils.matToBitmap(workingMat, outBitmap)
                  workingMat.release()

                  if (config.enableFaceRestore) stampDisclaimer(outBitmap)
                  return outBitmap
              }

              private fun applyLowLight(rgbMat: Mat): Mat {
                  val lab = Mat()
                  Imgproc.cvtColor(rgbMat, lab, Imgproc.COLOR_RGB2Lab)
                  val ch = ArrayList<Mat>(3)
                  Core.split(lab, ch)
                  val clahe = Imgproc.createCLAHE(2.2, Size(8.0, 8.0))
                  val enhL = Mat()
                  clahe.apply(ch[0], enhL)
                  Core.addWeighted(enhL, 0.70, ch[0], 0.30, 0.0, ch[0])
                  enhL.release()
                  Core.merge(ch, lab)
                  ch.forEach { it.release() }
                  val out = Mat()
                  Imgproc.cvtColor(lab, out, Imgproc.COLOR_Lab2RGB)
                  lab.release()
                  return out
              }

              private fun applyTemporal(currentRgb: Mat, alpha: Float): Mat {
                  val ycc = Mat()
                  Imgproc.cvtColor(currentRgb, ycc, Imgproc.COLOR_RGB2YCrCb)
                  val ch = ArrayList<Mat>(3)
                  Core.split(ycc, ch)
                  val curY = Mat()
                  ch[0].convertTo(curY, CvType.CV_32FC1)
                  val prev = previousEnhancedLuma
                  if (prev != null && prev.size() == curY.size()) {
                      val diff = Mat()
                      Core.absdiff(curY, prev, diff)
                      val mask = Mat()
                      Imgproc.threshold(diff, mask, 18.0, 1.0, Imgproc.THRESH_BINARY_INV)
                      mask.convertTo(mask, CvType.CV_8UC1)
                      val blended = Mat()
                      Core.addWeighted(curY, alpha.toDouble(), prev, (1.0 - alpha), 0.0, blended)
                      blended.copyTo(curY, mask)
                      diff.release(); mask.release(); blended.release()
                  }
                  previousEnhancedLuma?.release()
                  previousEnhancedLuma = curY.clone()
                  curY.convertTo(ch[0], CvType.CV_8UC1)
                  curY.release()
                  Core.merge(ch, ycc)
                  ch.forEach { it.release() }
                  val out = Mat()
                  Imgproc.cvtColor(ycc, out, Imgproc.COLOR_YCrCb2RGB)
                  ycc.release()
                  return out
              }

              private fun applySuperRes(rgbMat: Mat, scale: Int): Mat {
                  val target = Size((rgbMat.cols() * scale).toDouble(), (rgbMat.rows() * scale).toDouble())
                  val up = Mat()
                  Imgproc.resize(rgbMat, up, target, 0.0, 0.0, Imgproc.INTER_LANCZOS4)
                  val blur = Mat()
                  Imgproc.GaussianBlur(up, blur, Size(0.0, 0.0), 1.2)
                  val sharp = Mat()
                  Core.addWeighted(up, 1.35, blur, -0.35, 0.0, sharp)
                  up.release(); blur.release()
                  return sharp
              }

              private fun stampDisclaimer(bitmap: Bitmap) {
                  val canvas = Canvas(bitmap)
                  val bg = Paint().apply { color = Color.argb(200, 220, 38, 38) }
                  val txt = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE; textSize = max(18f, bitmap.width * 0.018f); isFakeBoldText = true
                  }
                  val h = txt.textSize * 2f
                  canvas.drawRect(0f, bitmap.height - h, bitmap.width.toFloat(), bitmap.height.toFloat(), bg)
                  canvas.drawText("AI RESTORED FACIAL DETAILS (INFERRED) - NOT VERIFIED IDENTITY EVIDENCE", 16f, bitmap.height - (h * 0.35f), txt)
              }

              override fun close() {
                  previousEnhancedLuma?.release()
                  srInterpreter?.close(); lowLightInterpreter?.close(); denoiseInterpreter?.close()
                  gpuDelegate?.close(); nnApiDelegate?.close()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hikvision/aienhancer/pipeline/VideoEnhancementPipeline.kt
          package com.hikvision.aienhancer.pipeline

          import android.content.Context
          import android.graphics.Bitmap
          import android.media.*
          import android.net.Uri
          import android.os.Environment
          import com.hikvision.aienhancer.ai.TiledInferenceEngine
          import com.hikvision.aienhancer.domain.EnhancementConfig
          import com.hikvision.aienhancer.domain.ProcessingTelemetry
          import com.hikvision.aienhancer.util.ThermalAndMemoryMonitor
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.nio.ByteBuffer
          import kotlin.coroutines.coroutineContext
          import kotlin.math.max

          class VideoEnhancementPipeline(private val context: Context, private val thermalMonitor: ThermalAndMemoryMonitor) {
              private val _telemetry = MutableStateFlow(ProcessingTelemetry())
              val telemetry: StateFlow<ProcessingTelemetry> = _telemetry
              @Volatile var isPaused: Boolean = false
              @Volatile var isCancelled: Boolean = false

              suspend fun processVideo(
                  sourceUri: Uri,
                  config: EnhancementConfig,
                  onComparisonSampleReady: (original: Bitmap, enhanced: Bitmap) -> Unit
              ): Result<File> = withContext(Dispatchers.Default) {
                  isPaused = false; isCancelled = false
                  val outDir = File(context.getExternalFilesDir(Environment.DIRECTORY_MOVIES), "HikvisionEnhancer").apply { mkdirs() }
                  val outputFile = File(outDir, "HIK_ENHANCED_${System.currentTimeMillis()}.mp4")
                  val retriever = MediaMetadataRetriever()
                  val extractor = MediaExtractor()
                  try {
                      retriever.setDataSource(context, sourceUri)
                      context.contentResolver.openFileDescriptor(sourceUri, "r")?.use { extractor.setDataSource(it.fileDescriptor) }
                      val durationUs = (retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 1000L) * 1000L
                      val frameRate = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_CAPTURE_FRAMERATE)?.toFloatOrNull() ?: 25f
                      val srcW = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)?.toIntOrNull() ?: 1280
                      val srcH = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)?.toIntOrNull() ?: 720
                      val totalFrames = max(1, ((durationUs / 1_000_000f) * frameRate).toInt())
                      val outW = (srcW * config.scaleFactor).let { it - (it % 2) }
                      val outH = (srcH * config.scaleFactor).let { it - (it % 2) }

                      var audioTrackIndex = -1
                      var audioFormat: MediaFormat? = null
                      for (i in 0 until extractor.trackCount) {
                          val f = extractor.getTrackFormat(i)
                          if ((f.getString(MediaFormat.KEY_MIME) ?: "").startsWith("audio/")) {
                              audioTrackIndex = i; audioFormat = f; break
                          }
                      }

                      val videoFormat = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, outW, outH).apply {
                          setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible)
                          setInteger(MediaFormat.KEY_BIT_RATE, outW * outH * 6)
                          setInteger(MediaFormat.KEY_FRAME_RATE, frameRate.toInt())
                          setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                      }
                      val encoder = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                      encoder.configure(videoFormat, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                      encoder.start()

                      val muxer = MediaMuxer(outputFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      var muxerVideoTrack = -1; var muxerAudioTrack = -1; var muxerStarted = false
                      val stepUs = (1_000_000f / frameRate).toLong()
                      var tsUs = 0L; var idx = 0
                      val bufferInfo = MediaCodec.BufferInfo()

                      TiledInferenceEngine(context, config).use { engine ->
                          while (tsUs < durationUs && coroutineContext.isActive && !isCancelled) {
                              while (isPaused && !isCancelled) { delay(200L) }
                              if (isCancelled) break
                              thermalMonitor.enforceThermalSafetyGuard()
                              val tileSize = thermalMonitor.computeSafeTileSize(config.tileSize)
                              val t0 = System.currentTimeMillis()
                              val orig = retriever.getFrameAtTime(tsUs, MediaMetadataRetriever.OPTION_CLOSEST) ?: break
                              val enh = engine.processFrame(orig, tileSize)
                              if (idx == 0 || idx % 15 == 0) {
                                  onComparisonSampleReady(orig.copy(Bitmap.Config.ARGB_8888, false), enh.copy(Bitmap.Config.ARGB_8888, false))
                              }
                              val yuv = bitmapToNv12(enh, outW, outH)
                              val inIdx = encoder.dequeueInputBuffer(10_000L)
                              if (inIdx >= 0) {
                                  val buf = encoder.getInputBuffer(inIdx)
                                  buf?.clear(); buf?.put(yuv)
                                  encoder.queueInputBuffer(inIdx, 0, yuv.size, tsUs, 0)
                              }
                              var outIdx = encoder.dequeueOutputBuffer(bufferInfo, 10_000L)
                              while (outIdx >= 0 || outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                  if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                      muxerVideoTrack = muxer.addTrack(encoder.outputFormat)
                                      if (audioFormat != null) muxerAudioTrack = muxer.addTrack(audioFormat)
                                      muxer.start(); muxerStarted = true
                                  } else if (outIdx >= 0) {
                                      val encData = encoder.getOutputBuffer(outIdx)
                                      if (encData != null && bufferInfo.size > 0 && muxerStarted) {
                                          encData.position(bufferInfo.offset); encData.limit(bufferInfo.offset + bufferInfo.size)
                                          muxer.writeSampleData(muxerVideoTrack, encData, bufferInfo)
                                      }
                                      encoder.releaseOutputBuffer(outIdx, false)
                                  }
                                  outIdx = encoder.dequeueOutputBuffer(bufferInfo, 0L)
                              }
                              orig.recycle(); enh.recycle()
                              val dt = max(1L, System.currentTimeMillis() - t0)
                              idx++; tsUs += stepUs
                              _telemetry.value = ProcessingTelemetry(idx, totalFrames, 1000f / dt, dt, engine.activeBackendSummary, thermalMonitor.getThermalStatusLabel(), thermalMonitor.getUsedMemoryMb(), false, engine.isUsingFallbackCpu)
                          }
                      }
                      if (muxerStarted && audioTrackIndex >= 0 && muxerAudioTrack >= 0 && !isCancelled) {
                          extractor.selectTrack(audioTrackIndex)
                          val abuf = ByteBuffer.allocateDirect(256 * 1024)
                          val ainfo = MediaCodec.BufferInfo()
                          while (true) {
                              val sz = extractor.readSampleData(abuf, 0)
                              if (sz < 0) break
                              ainfo.offset = 0; ainfo.size = sz; ainfo.presentationTimeUs = extractor.sampleTime; ainfo.flags = extractor.sampleFlags
                              muxer.writeSampleData(muxerAudioTrack, abuf, ainfo)
                              extractor.advance()
                          }
                      }
                      encoder.stop(); encoder.release()
                      if (muxerStarted) muxer.stop()
                      muxer.release()
                      if (isCancelled) { outputFile.delete(); Result.failure(InterruptedException("Cancelled")) } else Result.success(outputFile)
                  } catch (e: Exception) { Result.failure(e) } finally { retriever.release(); extractor.release() }
              }

              private fun bitmapToNv12(bmp: Bitmap, w: Int, h: Int): ByteArray {
                  val argb = IntArray(w * h)
                  bmp.getPixels(argb, 0, w, 0, 0, w, h)
                  val yuv = ByteArray(w * h * 3 / 2)
                  var yIdx = 0; var uvIdx = w * h
                  for (j in 0 until h) {
                      for (i in 0 until w) {
                          val c = argb[j * w + i]
                          val r = (c shr 16) and 0xFF; val g = (c shr 8) and 0xFF; val b = c and 0xFF
                          val y = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                          val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                          yuv[yIdx++] = y.coerceIn(0, 255).toByte()
                          if (j % 2 == 0 && i % 2 == 0 && uvIdx + 1 < yuv.size) {
                              yuv[uvIdx++] = u.coerceIn(0, 255).toByte(); yuv[uvIdx++] = v.coerceIn(0, 255).toByte()
                          }
                      }
                  }
                  return yuv
              }
          }
          EOF

